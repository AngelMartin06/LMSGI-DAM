<!DOCTYPE html>

<head>

</head>
<body>
    <div class="contenedor107">

            <div class="banner left">
                <div>
                    <h2>Special Offer</h2>

            <div class="cat107">

            </div>

                <p>Upto 42% Off</p>
                <div class="imgcat amarillo"></div>

            </div>

                <h3>Eggs And Meat</h3>
                <p>Upto 50% Off</p>
                <div class="imgcat carne"></div>
                <a href="#">Shop Now</a>
            </div>
            <div class="cat107">
                <h3>Fruits</h3>
                <p>Upto 25% Off</p>
                <div class="imgcat frutas"></div>
                <a href="#">Shop Now</a>
            </div>
