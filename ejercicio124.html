<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Redes sociales</title>
    <link rel="stylesheet" href="css_scss/ejercicio124.css">
</head>
<body>
    <div class="panel124">
        <h1>Redes sociales</h1>

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>¿Tengo cuenta?</th>
                    <th>Valoración</th>
                    <th>Dirección</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="nombre"><span>Facebook</span><div class="logo fb"></div></td>
                    <td class="check">✔</td>
                    <td class="valoracion">⭐⭐⭐☆☆<br><small>2,3 / 5</small></td>
                    <td><a href="#">http://www.facebook.com</a></td>
                </tr>
                <tr>
                    <td class="nombre"><span>Flickr</span><div class="logo flickr"></div></td>
                    <td class="check">✔</td>
                    <td class="valoracion">⭐⭐⭐⭐☆<br><small>4,25 / 5</small></td>
                    <td><a href="#">http://www.flickr.com</a></td>
                </tr>
                <tr>
                    <td class="nombre"><span>Vimeo</span><div class="logo vimeo"></div></td>
                    <td class="check">○</td>
                    <td class="valoracion">☆☆☆☆☆<br><small>Sin valorar todavía</small></td>
                    <td><a href="#">http://www.vimeo.com</a></td>
                </tr>
                <tr>
                    <td class="nombre"><span>Youtube</span><div class="logo yt"></div></td>
                    <td class="check">✔</td>
                    <td class="valoracion">⭐⭐⭐☆☆<br><small>2,75 / 5</small></td>
                    <td><a href="#">http://www.youtube.com</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
