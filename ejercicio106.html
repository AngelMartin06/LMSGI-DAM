<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" href="css_scss/ejercicio106.css">
</head>
<body>
    <div class="contenedor106">
        <div class="cards106">
            <div class="card106">
                <div class="foto manzana"></div>
                <h3>Apple</h3>
                <p>Price: $3</p>
                <a href="#">Product Add to Shopping Cart</a>
            </div>
            <div class="card106">
                <div class="foto naranja"></div>
                <h3>Orange</h3>
                <p>Price: $4</p>
                <a href="#">Product Add to Shopping Cart</a>
            </div>
            <div class="card106">
                <div class="foto banana"></div>
                <h3>Bananas</h3>
                <p>Price: $5</p>
                <a href="#">Product Add to Shopping Cart</a>
            </div>
        </div>

        <h2>Shopping Cart</h2>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Remove</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td><span class="remove">x</span></td>
                    <td><div class="mini manzana"></div></td>
                    <td>Apple</td>
                    <td><span class="btn">-</span> 1 <span class="btn">+</span></td>
                    <td>3</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td><span class="remove">x</span></td>
                    <td><div class="mini naranja"></div></td>
                    <td>Orange</td>
                    <td><span class="btn">-</span> 1 <span class="btn">+</span></td>
                    <td>4</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td><span class="remove">x</span></td>
                    <td><div class="mini banana"></div></td>
                    <td>Bananas</td>
                    <td><span class="btn">-</span> 1 <span class="btn">+</span></td>
                    <td>5</td>
                </tr>
            </tbody>
        </table>

        <div class="acciones106">
            <button class="clear">Clear</button>
            <div class="total106">
                <span>Total</span>
                <strong>$ 12.00</strong>
                <button>Buy</button>
            </div>
        </div>
    </div>
</body>
</html>
