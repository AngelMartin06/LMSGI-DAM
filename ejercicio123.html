<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Medios de comunicación</title>
    <link rel="stylesheet" href="css_scss/ejercicio123.css">
</head>
<body>
    <table>
        <tr class="titulo"><th colspan="3">MEDIOS DE COMUNICACIÓN</th></tr>
        <tr class="cabecera">
            <th>RADIO</th>
            <th>TELEVISIÓN</th>
            <th>PERIÓDICOS</th>
        </tr>
        <tr>
            <td class="radio">
                <ul>
                    <li>Radio Granada</li>
                    <li>Cadena SER</li>
                    <li>FM Andalucía</li>
                </ul>
            </td>
            <td class="tv">
                <ul>
                    <li>Antena 3</li>
                    <li>Cuatro</li>
                    <li>La Sexta</li>
                    <li>La 2</li>
                </ul>
            </td>
            <td class="periodicos">
                <div class="cols">
                    <ul>
                        <li>La Voz</li>
                        <li>Ideal</li>
                        <li>Granada Hoy</li>
                    </ul>
                    <ul>
                        <li>Washington Post</li>
                        <li>New York Times</li>
                    </ul>
                </div>
            </td>
        </tr>
        <tr class="colores">
            <td class="verde"></td>
            <td>
                <div class="franja"><span class="verde"></span><span class="amarillo"></span><span class="rojo"></span><span class="azul"></span></div>
            </td>
            <td class="verde"></td>
        </tr>
    </table>
</body>
</html>
